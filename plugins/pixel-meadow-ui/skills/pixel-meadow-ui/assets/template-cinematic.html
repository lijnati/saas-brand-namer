<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<title>Glade · A quieter place to think</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<!--
  TEMPLATE: "Cinematic" (single-screen waitlist / teaser).
  One full-viewport scene inside a rounded inset frame. Everything floats on the art.
  Swap: brand, headline (keep ONE italic serif word), sub, scene preset/seed.
-->
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.82);
    --ink-mute: rgba(255, 255, 255, 0.62);
    --forest: #15200f;
    --glass-border: rgba(255, 255, 255, 0.32);
    --glass-shadow: 0 20px 60px -20px rgba(10, 25, 40, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(255, 255, 255, 0.06);
    --blur: 22px;
    --radius-pill: 999px;
    --frame-gap: 12px;
    --frame-radius: 28px;
    --font-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-serif: "Instrument Serif", Georgia, serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  h1, p { margin: 0; }
  em { font-family: var(--font-serif); font-style: italic; font-weight: 400; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The inset frame: white page edge, rounded scene window */
  .frame { position: fixed; inset: var(--frame-gap); border-radius: var(--frame-radius); overflow: hidden; isolation: isolate; background: var(--forest); }
  .frame::after { /* film grain */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 10; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .hero { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; isolation: isolate; }
  .scene { position: absolute; inset: 0; z-index: -1; }
  .layer { position: absolute; inset: -3%; will-change: transform; }
  .photo { filter: brightness(.88) saturate(1.05); }
  .haze { inset: 0; background:
      radial-gradient(60% 45% at 50% 42%, rgba(10, 25, 40, .22), transparent 75%),
      linear-gradient(180deg, rgba(10, 25, 45, .28) 0%, rgba(10, 25, 45, .06) 46%, rgba(10, 30, 10, .22) 100%); }
  .pollen { inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .glass {
    background: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .08));
    border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%);
  }

  .nav { position: relative; z-index: 5; margin-top: 18px; width: min(950px, 100% - 32px); height: 60px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 5px 5px 5px 16px;
    border-radius: var(--radius-pill); animation: fade-down 1.2s var(--ease) both; }
  .brand { display: inline-flex; align-items: center; gap: 10px; justify-self: start; font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
  .brand svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 6px rgba(10, 30, 50, .25)); transition: transform .6s var(--ease); }
  .brand:hover svg { transform: rotate(-6deg) scale(1.05); }
  .nav-links { list-style: none; display: flex; gap: 28px; margin: 0; padding: 0; }
  .nav-links a { font-size: 15px; color: var(--ink-soft); transition: color .3s; }
  .nav-links a:hover { color: #fff; }
  .nav > .btn { justify-self: end; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; border: 0; cursor: pointer; white-space: nowrap;
    font: 500 15px/1 var(--font-sans); padding: 16px 24px; border-radius: var(--radius-pill);
    transition: transform .4s var(--ease), box-shadow .4s var(--ease), background .3s; }
  .btn-light { background: #fff; color: #17210f; box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .25), inset 0 -1px 0 rgba(0, 0, 0, .06); }
  .btn-light:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .35); }
  .btn-light:active { transform: scale(.98); }
  .btn .arrow { display: inline-block; transition: transform .4s var(--ease); }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-sm { padding: 15px 24px; font-size: 14px; }

  .hero-inner { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px 16vh; width: 100%; }
  .headline { font-weight: 500; font-size: clamp(42px, 6.6vw, 92px); line-height: 1.02; letter-spacing: -.035em; text-shadow: 0 2px 30px rgba(10, 30, 50, .3); }
  .headline em { font-size: 1.08em; letter-spacing: -.01em; }
  .sub { margin-top: 22px; font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5; color: var(--ink-soft); max-width: 34ch; text-shadow: 0 1px 20px rgba(10, 30, 50, .4); }

  .waitlist { margin-top: 30px; width: min(540px, 100%); display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 26px; border-radius: var(--radius-pill); transition: border-color .3s, box-shadow .3s; }
  .waitlist:focus-within { border-color: rgba(255, 255, 255, .7); box-shadow: var(--glass-shadow), 0 0 0 5px rgba(255, 255, 255, .12); }
  .waitlist input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff; font: 400 16px var(--font-sans); padding: 12px 0; }
  .waitlist input::placeholder { color: rgba(255, 255, 255, .7); }
  .waitlist.is-error { border-color: rgba(255, 190, 170, .9); animation: shake .45s; }
  .form-note { margin-top: 14px; font-size: 13px; color: var(--ink-mute); min-height: 1.3em; }
  .form-note.ok { color: #fff; }

  .hero-foot { position: absolute; bottom: 22px; left: 0; right: 0; z-index: 3; width: min(1120px, 100% - 64px); margin: 0 auto;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: rgba(255, 255, 255, .85);
    text-shadow: 0 1px 10px rgba(0, 20, 0, .4); animation: fade-in 1.4s .9s var(--ease) both; }
  .hero-foot a { color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .45); }

  .critter { position: absolute; z-index: 1; pointer-events: none; }
  .critter canvas { animation: bob 3.2s ease-in-out infinite; }

  .reveal { opacity: 0; transform: translateY(24px); filter: blur(6px);
    transition: opacity 1.2s var(--ease), transform 1.2s var(--ease), filter 1.2s var(--ease); transition-delay: var(--d, 0s); }
  .reveal.is-in { opacity: 1; transform: none; filter: none; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes fade-down { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  @media (max-width: 640px) {
    :root { --frame-gap: 8px; --frame-radius: 22px; }
    .nav { width: calc(100% - 20px); margin-top: 12px; padding-left: 14px; gap: 12px; }
    .nav-links { gap: 18px; } .nav-links a { font-size: 14px; }
    .btn-sm { padding: 10px 14px; font-size: 13px; }
    .hero-inner { padding-bottom: 20vh; }
    .waitlist { flex-direction: column; padding: 8px; border-radius: 26px; }
    .waitlist input { width: 100%; padding: 14px 16px; text-align: center; }
    .waitlist .btn { width: 100%; }
    .hero-foot { bottom: 14px; font-size: 12.5px; flex-direction: column; align-items: center; gap: 2px; }
    .critter { display: none; }
  }
  @media (max-width: 480px) { .nav-links li:not(:first-child) { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
<div class="frame">
  <header class="hero">
    <div class="scene" aria-hidden="true">
      <div class="layer photo" id="scene" data-depth="0.35"></div>
      <div class="layer haze"></div>
      <canvas class="layer pollen" id="pollen"></canvas>
      <div class="critter" style="left:14%;top:30%" data-depth="0.9" id="bird"></div>
    </div>

    <nav class="nav glass" aria-label="Primary">
      <a class="brand" href="/" aria-label="Glade home">
        <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 24c4-9 7-13 11-13s7 4 11 13"/><circle cx="16" cy="6.5" r="2.2" fill="#fff" stroke="none"/></svg>
        Glade
      </a>
      <ul class="nav-links">
        <li><a href="#">Product</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="#join">Early access <span class="arrow">→</span></a>
    </nav>

    <div class="hero-inner">
      <h1 class="headline reveal">A quieter place<br/>to <em>think</em> out loud.</h1>
      <p class="sub reveal" style="--d:.15s">A journal that listens back, so the week makes a little more sense by Sunday.</p>
      <form class="waitlist glass reveal" style="--d:.3s" id="join" novalidate>
        <label class="sr-only" for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required />
        <button class="btn btn-light" type="submit">Get early access <span class="arrow">→</span></button>
      </form>
      <p class="form-note reveal" style="--d:.4s" data-note>Join the first few hundred people in.</p>
    </div>

    <footer class="hero-foot">
      <span>© 2026 Glade</span>
      <span>Questions? <a href="mailto:hello@example.com">hello@example.com</a></span>
    </footer>
  </header>
</div>

<!-- In production, inline pixel-scene.js here or serve it next to this file. -->
<script src="pixel-scene.js"></script>
<script>
  PixelScene.mount(document.getElementById("scene"), { preset: "meadow", seed: 7 });
  PixelScene.pollen(document.getElementById("pollen"));
  PixelScene.sprite(document.getElementById("bird"), "bird", { scale: 3 });
  PixelScene.parallax(document);

  // Reveal on load / scroll
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  // Waitlist: validate, shake on error, friendly success state
  const form = document.getElementById("join"), note = form.nextElementSibling, input = form.querySelector("input"), btn = form.querySelector("button");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    form.classList.remove("is-error");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(input.value.trim())) {
      void form.offsetWidth; form.classList.add("is-error");
      note.textContent = "Hmm, that email doesn't look quite right."; note.classList.remove("ok"); input.focus(); return;
    }
    btn.disabled = true; btn.textContent = "Saving your spot…";
    // TODO: POST to your backend here.
    await new Promise((r) => setTimeout(r, 700));
    btn.textContent = "You're on the list ✓"; note.textContent = "We'll write when it's your turn."; note.classList.add("ok");
    input.placeholder = input.value; input.value = "";
  });
  document.querySelectorAll('a[href="#join"]').forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); input.focus({ preventScroll: true }); }));
</script>
</body>
</html>
